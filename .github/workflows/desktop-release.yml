name: ZION Public Desktop Miner — Multi-OS Release

# Builds the public desktop miner for Linux, Windows and macOS, then uploads
# the artifacts to the public repository:
#   https://github.com/Zion-TerraNova/v3-Mainnet
#
# Required repository secret:
#   PUBLIC_RELEASE_TOKEN  -- GitHub PAT with 'repo' or 'public_repo' scope,
#                            used to upload assets to the public repo.
#
# Usage:
#   1. Set PUBLIC_RELEASE_TOKEN in repository secrets.
#   2. Run the workflow manually and choose which platforms to build.
#   3. If a release with the same tag already exists on the public repo, the
#      new assets are uploaded with --clobber and the release notes are updated.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v3.2.0-desktop'
        required: true
        type: string
      draft:
        description: 'Create as draft release (only used when creating a new release)'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux packages'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows packages'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS packages'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v3.2.0-desktop*'
      - 'v3.1.0-desktop*'
      - 'desktop-v*'

env:
  DESKTOP_DIR: 'archive/DesktopAgentP3.0.6'
  PUBLIC_REPO: Zion-TerraNova/v3-Mainnet

defaults:
  run:
    working-directory: archive/DesktopAgentP3.0.6

jobs:
  build-linux:
    name: Build Linux (AppImage + DEB)
    if: github.event_name == 'push' || inputs.build_linux == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/DesktopAgentP3.0.6/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ocl-icd-opencl-dev libssl-dev pkg-config

      - name: Install Node dependencies
        run: npm ci

      - name: Build Linux packages
        run: |
          node scripts/prepare-rust-miner.js --features "public_build,auxpow,gpu-opencl,gpu-cuda,native-all,tui"
          npx electron-builder --linux --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            archive/DesktopAgentP3.0.6/dist/*.AppImage
            archive/DesktopAgentP3.0.6/dist/*.deb
            archive/DesktopAgentP3.0.6/dist/latest-linux.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS + ZIP)
    if: github.event_name == 'push' || inputs.build_windows == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/DesktopAgentP3.0.6/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCL via vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { (vcpkg root) }
          if (-not $vcpkgRoot) { throw "Could not determine vcpkg root" }
          vcpkg install opencl:x64-windows
          $openclLib = Join-Path $vcpkgRoot "installed\x64-windows\lib"
          $openclInc = Join-Path $vcpkgRoot "installed\x64-windows\include"
          if (-not (Test-Path (Join-Path $openclLib "OpenCL.lib"))) {
            throw "OpenCL.lib not found in $openclLib"
          }
          echo "VCPKG_ROOT=$vcpkgRoot" >> ${env:GITHUB_ENV}
          echo "LIB=$openclLib;${env:LIB}" >> ${env:GITHUB_ENV}
          echo "INCLUDE=$openclInc;${env:INCLUDE}" >> ${env:GITHUB_ENV}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo "$nsisPath" >> ${env:GITHUB_PATH}
          }

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows packages
        env:
          LIB: ${{ env.LIB }}
          INCLUDE: ${{ env.INCLUDE }}
        run: |
          node scripts/prepare-rust-miner.js --features "public_build,auxpow,gpu-opencl,gpu-cuda,native-all,tui"
          # Invoke the local module entry point via node directly to bypass
          # npx's shell-based bin resolution (more reliable on Windows runners).
          node .\node_modules\electron-builder\cli.js --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            archive/DesktopAgentP3.0.6/dist/*.exe
            archive/DesktopAgentP3.0.6/dist/*.zip
            archive/DesktopAgentP3.0.6/dist/*.exe.blockmap
            archive/DesktopAgentP3.0.6/dist/latest.yml
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    if: github.event_name == 'push' || inputs.build_macos == true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/DesktopAgentP3.0.6/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build macOS package
        run: |
          node scripts/prepare-rust-miner.js --features "public_build,auxpow,gpu-opencl,gpu-metal,native-all,tui"
          npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            archive/DesktopAgentP3.0.6/dist/*.dmg
            archive/DesktopAgentP3.0.6/dist/*.dmg.blockmap
            archive/DesktopAgentP3.0.6/dist/latest-mac.yml
          if-no-files-found: error

  release:
    name: Create or update public release
    needs: [build-linux, build-windows, build-macos]
    if: always() && !cancelled() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*

      - name: Prepare release assets and checksums
        working-directory: artifacts
        run: |
          mkdir -p release
          find . -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.exe' -o -name '*.zip' -o \
            -name '*.dmg' -o -name '*.blockmap' -o \
            -name 'latest*.yml' \
          \) -exec cp {} release/ \;
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Check release token
        shell: bash
        run: |
          if [ -z "${PUBLIC_RELEASE_TOKEN}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN secret is missing. Cannot upload to public repo."
            exit 1
          fi
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Create or update public release
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT_FLAG: ${{ inputs.draft == true && '--draft' || '' }}
          NOTES_FILE: ${{ github.workspace }}/archive/DesktopAgentP3.0.6/RELEASE_NOTES.md
        run: |
          set -e
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Uploading assets with --clobber."
            gh release upload --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" --title "ZION Public Desktop Miner v3.2.0" --notes-file "${NOTES_FILE}"
          else
            echo "Creating new release ${RELEASE_TAG}."
            gh release create "${RELEASE_TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "ZION Public Desktop Miner v3.2.0" \
              --notes-file "${NOTES_FILE}" \
              ${DRAFT_FLAG} \
              "${assets[@]}"
          fi
