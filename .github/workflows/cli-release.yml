name: ZION Public CLI — Multi-Platform Release

# Builds the public ZION V31 unified CLI (`zion`) for Linux x86_64,
# Linux ARM64, Windows x86_64, macOS Apple Silicon and macOS Intel, then
# uploads the artifacts to the public repository:
#   https://github.com/Zion-TerraNova/v3-Mainnet
#
# Required repository secret:
#   PUBLIC_RELEASE_TOKEN  -- GitHub PAT with 'repo' or 'public_repo' scope

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v3.2.0-cli'
        required: true
        type: string
      draft:
        description: 'Create as draft release (only for new releases)'
        required: false
        default: false
        type: boolean
      build_linux_x86_64:
        description: 'Build Linux x86_64'
        required: false
        default: true
        type: boolean
      build_linux_arm64:
        description: 'Build Linux ARM64'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows x86_64'
        required: false
        default: true
        type: boolean
      build_macos_arm64:
        description: 'Build macOS Apple Silicon'
        required: false
        default: true
        type: boolean
      build_macos_x86_64:
        description: 'Build macOS Intel (cross from ARM64)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v3.2.0-cli*'
      - 'v3.1.0-cli*'
      - 'cli-v*'

env:
  PUBLIC_REPO: Zion-TerraNova/v3-Mainnet
  VERSION: "3.2.0"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    if: github.event_name == 'push' || inputs.build_linux_x86_64 == true
    runs-on: ubuntu-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev pkg-config

      - name: Build CLI
        working-directory: V31
        run: |
          cargo build --release -p zion-cli

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion V31/dist/
          cd V31/dist
          tar czf zion-cli-v${{ env.VERSION }}-linux-x86_64.tar.gz zion
          sha256sum zion-cli-v${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x86_64
          path: V31/dist/zion-cli-v${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64
    if: github.event_name == 'push' || inputs.build_linux_arm64 == true
    runs-on: ubuntu-24.04-arm
    env:
      ZION_CPU_TARGET: armv8-a
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev pkg-config

      - name: Build CLI
        working-directory: V31
        run: |
          cargo build --release -p zion-cli

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion V31/dist/
          cd V31/dist
          tar czf zion-cli-v${{ env.VERSION }}-linux-arm64.tar.gz zion
          sha256sum zion-cli-v${{ env.VERSION }}-linux-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-arm64
          path: V31/dist/zion-cli-v${{ env.VERSION }}-linux-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    if: github.event_name == 'push' || inputs.build_windows == true
    runs-on: windows-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          choco install 7zip -y

      - name: Build CLI
        working-directory: V31
        shell: pwsh
        run: |
          cargo build --release -p zion-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path V31\dist
          Copy-Item V31\target\release\zion.exe V31\dist\zion.exe
          cd V31\dist
          7z a -tzip zion-cli-v${{ env.VERSION }}-windows-x86_64.zip zion.exe
          Get-FileHash zion-cli-v${{ env.VERSION }}-windows-x86_64.zip -Algorithm SHA256 | Select-Object Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x86_64
          path: V31/dist/zion-cli-v${{ env.VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon
    if: github.event_name == 'push' || inputs.build_macos_arm64 == true
    runs-on: macos-latest
    env:
      ZION_CPU_TARGET: armv8-a
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        working-directory: V31
        run: |
          cargo build --release -p zion-cli

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion V31/dist/
          cd V31/dist
          tar czf zion-cli-v${{ env.VERSION }}-macos-arm64.tar.gz zion
          shasum -a 256 zion-cli-v${{ env.VERSION }}-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: V31/dist/zion-cli-v${{ env.VERSION }}-macos-arm64.tar.gz
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS Intel (cross from ARM64)
    if: github.event_name == 'push' || inputs.build_macos_x86_64 == true
    runs-on: macos-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build CLI
        working-directory: V31
        run: |
          cargo build --release -p zion-cli --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/x86_64-apple-darwin/release/zion V31/dist/
          cd V31/dist
          tar czf zion-cli-v${{ env.VERSION }}-macos-x86_64.tar.gz zion
          shasum -a 256 zion-cli-v${{ env.VERSION }}-macos-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos-x86_64
          path: V31/dist/zion-cli-v${{ env.VERSION }}-macos-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Upload to public release
    needs: [build-linux-x86_64, build-linux-arm64, build-windows, build-macos-arm64, build-macos-x86_64]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*

      - name: Prepare release assets
        working-directory: artifacts
        run: |
          mkdir -p release
          find . -name '*.tar.gz' -o -name '*.zip' | xargs -I{} cp {} release/
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Check release token
        shell: bash
        run: |
          if [ -z "${PUBLIC_RELEASE_TOKEN}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN secret is missing."
            exit 1
          fi
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Upload to public release
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT_FLAG: ${{ inputs.draft == true && '--draft' || '' }}
          RELEASE_NOTES: |
            ## ZION v3.2.0 — Public CLI

            The unified ZION command-line interface for the V31 Mainnet Alpha network. Use it to create and manage wallets, check balances, send transactions, query node/pool status and bootstrap a local node.

            ### Highlights
            - Wallet uses the public HTTPS API by default (falling back to TCP RPC where needed)
            - Single portable `zion` binary — no GPU dependencies
            - Built from the canonical V31 workspace

            ### Downloads
            | File | Platform |
            |------|----------|
            | zion-cli-v3.2.0-linux-x86_64.tar.gz | Linux x86_64 |
            | zion-cli-v3.2.0-linux-arm64.tar.gz | Linux ARM64 |
            | zion-cli-v3.2.0-windows-x86_64.zip | Windows x86_64 |
            | zion-cli-v3.2.0-macos-arm64.tar.gz | macOS Apple Silicon |
            | zion-cli-v3.2.0-macos-x86_64.tar.gz | macOS Intel |

            See SHA256SUMS.txt for checksums.
        run: |
          set -e
          echo "${RELEASE_NOTES}" > /tmp/cli-release-notes.md
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists. Uploading with --clobber and syncing title/notes."
            gh release upload --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" --title "ZION v3.2.0 — Public CLI" --notes-file /tmp/cli-release-notes.md
          else
            echo "Creating new release ${RELEASE_TAG}."
            gh release create "${RELEASE_TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "ZION v3.2.0 — Public CLI" \
              --notes-file /tmp/cli-release-notes.md \
              ${DRAFT_FLAG} \
              "${assets[@]}"
          fi
