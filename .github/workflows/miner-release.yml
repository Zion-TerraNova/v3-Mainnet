name: ZION Boost Miner — Multi-Platform Release

# Builds the public ZION V31 miner binary for Linux x86_64, Linux ARM64,
# Windows x86_64, macOS Apple Silicon and macOS Intel, then uploads the
# artifacts to the public repository:
#   https://github.com/Zion-TerraNova/v3-Mainnet
#
# Required repository secret:
#   PUBLIC_RELEASE_TOKEN  -- GitHub PAT with 'repo' or 'public_repo' scope

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v3.2.0-miner'
        required: true
        type: string
      draft:
        description: 'Create as draft release (only for new releases)'
        required: false
        default: false
        type: boolean
      build_linux_x86_64:
        description: 'Build Linux x86_64'
        required: false
        default: true
        type: boolean
      build_linux_arm64:
        description: 'Build Linux ARM64'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows x86_64'
        required: false
        default: true
        type: boolean
      build_macos_arm64:
        description: 'Build macOS Apple Silicon'
        required: false
        default: true
        type: boolean
      build_macos_x86_64:
        description: 'Build macOS Intel (cross from ARM64)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v3.2.0'
      - 'v3.2.0-miner*'
      - 'v3.1.0'
      - 'v3.1.0-miner*'
      - 'miner-v*'

env:
  PUBLIC_REPO: Zion-TerraNova/v3-Mainnet
  VERSION: "3.2.0"
  ZION_DISABLE_OPENMP: "1"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    if: github.event_name == 'push' || inputs.build_linux_x86_64 == true
    runs-on: ubuntu-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ocl-icd-opencl-dev libssl-dev pkg-config

      - name: Build miner
        working-directory: V31
        run: |
          cargo build --release -p zion-miner \
            --features "public_build,auxpow,gpu-opencl,gpu-cuda,native-all,tui"

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion-miner V31/dist/
          cd V31/dist
          tar czf zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz zion-miner
          sha256sum zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-linux-x86_64
          path: V31/dist/zion-miner-v${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64
    if: github.event_name == 'push' || inputs.build_linux_arm64 == true
    runs-on: ubuntu-24.04-arm
    env:
      ZION_CPU_TARGET: armv8-a
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ocl-icd-opencl-dev libssl-dev pkg-config

      - name: Build miner
        working-directory: V31
        run: |
          cargo build --release -p zion-miner \
            --features "public_build,auxpow,gpu-opencl,native-all,tui"

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion-miner V31/dist/
          cd V31/dist
          tar czf zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz zion-miner
          sha256sum zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-linux-arm64
          path: V31/dist/zion-miner-v${{ env.VERSION }}-linux-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    if: github.event_name == 'push' || inputs.build_windows == true
    runs-on: windows-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCL via vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { (vcpkg root) }
          if (-not $vcpkgRoot) { throw "Could not determine vcpkg root" }
          vcpkg install opencl:x64-windows
          $openclLib = Join-Path $vcpkgRoot "installed\x64-windows\lib"
          $openclInc = Join-Path $vcpkgRoot "installed\x64-windows\include"
          if (-not (Test-Path (Join-Path $openclLib "OpenCL.lib"))) {
            throw "OpenCL.lib not found in $openclLib"
          }
          echo "VCPKG_ROOT=$vcpkgRoot" >> ${env:GITHUB_ENV}
          echo "LIB=$openclLib;${env:LIB}" >> ${env:GITHUB_ENV}
          echo "INCLUDE=$openclInc;${env:INCLUDE}" >> ${env:GITHUB_ENV}

      - name: Build miner
        working-directory: V31
        shell: bash
        env:
          LIB: ${{ env.LIB }}
          INCLUDE: ${{ env.INCLUDE }}
        run: |
          cargo build --release -p zion-miner \
            --features "public_build,auxpow,gpu-opencl,gpu-cuda,native-all,tui"

      - name: Package
        shell: bash
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion-miner.exe V31/dist/
          cd V31/dist
          7z a -tzip zion-miner-v${{ env.VERSION }}-windows-x86_64.zip zion-miner.exe
          sha256sum zion-miner-v${{ env.VERSION }}-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-windows-x86_64
          path: V31/dist/zion-miner-v${{ env.VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon
    if: github.event_name == 'push' || inputs.build_macos_arm64 == true
    runs-on: macos-latest
    env:
      ZION_CPU_TARGET: armv8-a
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build miner
        working-directory: V31
        run: |
          cargo build --release -p zion-miner \
            --features "public_build,auxpow,gpu-opencl,gpu-metal,native-all,tui"

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/release/zion-miner V31/dist/
          cd V31/dist
          tar czf zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz zion-miner
          shasum -a 256 zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-macos-arm64
          path: V31/dist/zion-miner-v${{ env.VERSION }}-macos-arm64.tar.gz
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS Intel (cross from ARM64)
    if: github.event_name == 'push' || inputs.build_macos_x86_64 == true
    runs-on: macos-latest
    env:
      ZION_CPU_TARGET: x86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build miner
        working-directory: V31
        run: |
          cargo build --release -p zion-miner --target x86_64-apple-darwin \
            --features "public_build,auxpow,gpu-opencl,gpu-metal,native-all,tui"

      - name: Package
        run: |
          mkdir -p V31/dist
          cp V31/target/x86_64-apple-darwin/release/zion-miner V31/dist/
          cd V31/dist
          tar czf zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz zion-miner
          shasum -a 256 zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner-macos-x86_64
          path: V31/dist/zion-miner-v${{ env.VERSION }}-macos-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Upload to public release
    needs: [build-linux-x86_64, build-linux-arm64, build-windows, build-macos-arm64, build-macos-x86_64]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: miner-*

      - name: Prepare release assets
        working-directory: artifacts
        run: |
          mkdir -p release
          find . -name '*.tar.gz' -o -name '*.zip' | xargs -I{} cp {} release/
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Check release token
        shell: bash
        run: |
          if [ -z "${PUBLIC_RELEASE_TOKEN}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN secret is missing."
            exit 1
          fi
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Upload to public release
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT_FLAG: ${{ inputs.draft == true && '--draft' || '' }}
          RELEASE_NOTES: |
            ## ZION v3.2.0 — Public Boost Miner

            One-click public miner with TUI, the canonical Ekam Deeksha v3.2 PoW (512 KiB, 2 passes, 128 random reads, Keccak-256) and all native algorithms (RandomX, GhostRider, VerusHash, Etchash, KawPow, Autolykos, kHeavyHash, BLAKE3). Best GPU backend per platform:
            - Linux x86_64: CUDA + OpenCL
            - Windows x86_64: CUDA + OpenCL
            - macOS arm64 / x86_64: Metal + OpenCL
            - Linux ARM64: OpenCL

            The public build shows only **ZION** plus **BOOST 1** / **BOOST 2** streams in the TUI, banner and logs — the miner still runs merged mining in the background to optimize total returns.

            ### Downloads
            | File | Platform |
            |------|----------|
            | zion-miner-v3.2.0-linux-x86_64.tar.gz | Linux x86_64 |
            | zion-miner-v3.2.0-linux-arm64.tar.gz | Linux ARM64 |
            | zion-miner-v3.2.0-windows-x86_64.zip | Windows x86_64 |
            | zion-miner-v3.2.0-macos-arm64.tar.gz | macOS Apple Silicon |
            | zion-miner-v3.2.0-macos-x86_64.tar.gz | macOS Intel |

            See SHA256SUMS.txt for checksums.
        run: |
          set -e
          echo "${RELEASE_NOTES}" > /tmp/miner-release-notes.md
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists. Uploading with --clobber and syncing title/notes."
            gh release upload --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit --repo "${PUBLIC_REPO}" "${RELEASE_TAG}" --title "ZION v3.2.0 — Public Boost Miner" --notes-file /tmp/miner-release-notes.md
          else
            echo "Creating new release ${RELEASE_TAG}."
            gh release create "${RELEASE_TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "ZION v3.2.0 — Public Boost Miner" \
              --notes-file /tmp/miner-release-notes.md \
              ${DRAFT_FLAG} \
              "${assets[@]}"
          fi
